name: Scrape odds

on:
  schedule:
    # GitHub cron is UTC. 12:00-23:59 + 00:00-04:59 UTC ≈ 8am-12:59am ET.
    - cron: '0,30 12-23 * * *'
    - cron: '0,30 0-4 * * *'
  workflow_dispatch: {}

concurrency:
  group: scrape-odds
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: odds-scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r odds-scraper/requirements.txt

      - name: Scrape ESPN -> Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python odds-scraper/scraper.py --days-back 0 --days-ahead 2
